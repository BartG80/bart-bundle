workflows:
  bart-bundle-workflow:
    name: bart-bundle (Android 34 fix)
    max_build_duration: 20
    environment:
      flutter: stable
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Create Android folder if missing
        script: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi
      - name: FIX - Aggiorna a compileSdk 34
        script: |
          sed -i.bak 's/compileSdkVersion 33/compileSdkVersion 34/g' android/app/build.gradle || true
          sed -i.bak 's/compileSdk 33/compileSdk 34/g' android/app/build.gradle || true
          sed -i.bak 's/targetSdkVersion 33/targetSdkVersion 34/g' android/app/build.gradle || true
          sed -i.bak 's/targetSdk 33/targetSdk 34/g' android/app/build.gradle || true
          sed -i.bak 's/compileSdk = 33/compileSdk = 34/g' android/app/build.gradle.kts || true
          sed -i.bak 's/targetSdk = 33/targetSdk = 34/g' android/app/build.gradle.kts || true
          cat android/app/build.gradle | grep -E "compileSdk|targetSdk"
      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
