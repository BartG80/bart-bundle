workflows:
  bart-bundle-workflow:
    name: bart-finale-36
    max_build_duration: 20
    environment:
      flutter: 3.35.0
      java: 17
    scripts:
      - name: Build APK
        script: |
          flutter create . --platforms=android --org com.bart.bundle
          flutter pub upgrade
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
