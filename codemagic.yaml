workflows:
  bart-bundle-4-apk:
    name: Bart Bundle 4 APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Build all APKs
        script: |
          flutter build apk --target=lib/main_elettrico.dart --release
          mkdir -p build/apks
          cp build/app/outputs/flutter-apk/app-release.apk build/apks/elettrico.apk
          flutter build apk --target=lib/main_idraulico.dart --release
          cp build/app/outputs/flutter-apk/app-release.apk build/apks/idraulico.apk
          flutter build apk --target=lib/main_edile.dart --release
          cp build/app/outputs/flutter-apk/app-release.apk build/apks/edile.apk
          flutter build apk --target=lib/main_falegname.dart --release
          cp build/app/outputs/flutter-apk/app-release.apk build/apks/falegname.apk
    artifacts:
      - build/apks/*.apk
      - build/app/outputs/flutter-apk/*.apk