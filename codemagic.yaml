workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Crea cartella Android e sistema compileSdk
        script: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi
          python3 -c "
          import pathlib
          p = pathlib.Path('android/app/build.gradle.kts')
          t = p.read_text()
          import re
          t = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', t)
          t = re.sub(r'targetSdk\s*=\s*\d+', 'targetSdk = 36', t)
          t = re.sub(r'minSdk\s*=\s*\d+', 'minSdk = 21', t)
          t = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', t)
          t = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 36', t)
          p.write_text(t)
          print(p.read_text()[:1000])
          "
      - name: Pub get
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
