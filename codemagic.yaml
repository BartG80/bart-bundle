workflows:
  bart-bundle-workflow:
   name:bart-36-finale
   max_build_duration: 20
   environment:
     flutter: stable
	 xcode: latest
	 cocoapods: default 
	 java: 17
   scripts:
     - name: Build APK
	   script: |
	     flutter create . --platforms=android --org com.bart.bundle
		 flutter pub upgrade
		 flutter build apk --release --no-tree-shake-icons
   artifacts:
     - build/**/outputs/**/*.apk
