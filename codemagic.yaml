workflows:
  bart-bundle:
    name: Bart Bundle 4 APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.22.2
    scripts:
      - name: Get deps
        script: flutter pub get
      - name: Build Elettrico
        script: flutter build apk --target=lib/main_elettrico.dart --release -v --build-name=1.0 --build-number=1 --no-tree-shake-icons
      - name: Build Idraulico
        script: flutter build apk --target=lib/main_idraulico.dart --release --build-name=1.0 --build-number=2 --no-tree-shake-icons
      - name: Build Edile
        script: flutter build apk --target=lib/main_edile.dart --release --build-name=1.0 --build-number=3 --no-tree-shake-icons
      - name: Build Falegname
        script: flutter build apk --target=lib/main_falegname.dart --release --build-name=1.0 --build-number=4 --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
