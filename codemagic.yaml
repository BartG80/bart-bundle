workflows:
  bart-bundle-4-apk:
    name: Bart Bundle 4 APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Create Android folder
        script: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.bart.bundle --project-name bart_bundle
          fi
          flutter clean
          flutter pub get
      - name: Build all APKs
        script: |
          flutter build apk --target=lib/main_elettrico.dart --release --no-tree-shake-icons
          flutter build apk --target=lib/main_idraulico.dart --release --no-tree-shake-icons
          flutter build apk --target=lib/main_edile.dart --release --no-tree-shake-icons
          flutter build apk --target=lib/main_falegname.dart --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk