workflows:
  bart-bundle-workflow:
    name: bart-36-finale
    max_build_duration: 20
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Build APK
        script: |
          flutter create . --platforms=android --org com.bart.bundle
          flutter pub upgrade
          flutter build apk --release --no-tree-shake-icona
    artifacts:
      - build/**/outputs/**/*.apk
