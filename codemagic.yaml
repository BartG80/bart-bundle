workflows:
  android-workflow:
    name: Android Workflow
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Fix project and SDK
        script: |
          flutter create . --platforms=android --project-name bart_bundle --org com.bart --no-pub
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - bart@example.com
