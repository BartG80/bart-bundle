workflows:
  bart-bundle-workflow:
    name: bart-falegname-final
    max_build_duration: 20
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Build APK
        script: |
          rm -rf android
          flutter create . --platforms=android --org com.bart.bundle
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
