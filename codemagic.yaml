workflows:
  wood-pro-android:
    name: Wood Pro v9.7.0 Android
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
    scripts:
      - name: Create missing Android files
        script: |
          flutter create . --project-name wood_pro
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Flutter analyze
        script: |
          flutter analyze || true
      - name: Build APK Release
        script: |
          flutter build apk --release --build-name=9.7.0 --build-number=1
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - gabriele2180@gmail.com
        notify:
          success: true
          failure: true
